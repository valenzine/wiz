[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-wiz"
version = "0.19.0"
description = "A transcription CLI for meetings, screen recordings, and interviews — powered by whisper.cpp, with diarization, speaker naming, screenshots, HTML transcripts, and auto-detecting AI analysis (summary, action items, implementation plans, session notes)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Valentin Muro" }, { name = "ReidenXerx" }]
requires-python = ">=3.11"
keywords = ["whisper", "whisper.cpp", "speech-to-text", "transcription", "cli", "ffmpeg", "diarization", "speakers", "sherpa-onnx", "rich", "ollama", "ai-analysis", "implementation-plan"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["rich>=13"]

[project.optional-dependencies]
test = ["pytest>=7"]
# Keep in sync with DIARIZE_REQUIREMENT in wiz/diarize.py (the auto-setup
# installs the same spec, so the auto and manual paths agree; a test checks).
diarize = ["sherpa-onnx>=1.13.6"]

[project.urls]
Homepage = "https://github.com/valenzine/wiz"
Repository = "https://github.com/valenzine/wiz"
Issues = "https://github.com/valenzine/wiz/issues"

[project.scripts]
wiz = "wiz.cli:main"

[tool.setuptools]
packages = ["wiz"]
